[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-vision-event-filter"
version = "0.1.0"
description = "Detects motion events in video streams."
requires-python = ">=3.14"

dependencies = [
    "opencv-python>=4.11,<5",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "numpy>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"] 