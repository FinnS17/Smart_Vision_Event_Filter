[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-vision-event-filter"
version = "0.1.0"
description = "Detects motion events in video streams."
requires-python = ">=3.14"

dependencies = [
    "opencv-python>=4.11,<5",
]
[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "numpy>=2,<3",
    "ruff>=0.16,<1",
]
ai = [
    "ultralytics>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]