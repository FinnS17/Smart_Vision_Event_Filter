name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install project and dev tools
        run: python -m pip install ".[dev]"
      - name: Check code style
        run: python -m ruff check src tests
      - name: Run tests
        run: python -m pytest